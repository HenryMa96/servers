<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f14'/%3E%3Crect x='7' y='9' width='18' height='14' rx='3' fill='none' stroke='%234da3ff' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='1.6' fill='%234da3ff'/%3E%3Cpath d='M20 14h2M20 18h2' stroke='%234da3ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f14;
    --line:rgba(255,255,255,.085);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:24px;
    background:
      radial-gradient(760px 420px at 12% -8%, rgba(77,163,255,.14), transparent 62%),
      radial-gradient(620px 380px at 96% 8%, rgba(229,160,13,.085), transparent 64%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  .dock{
    display:flex;
    align-items:center;
    gap:clamp(14px,4.2vw,22px);
    padding:clamp(14px,3.6vw,18px);
    border-radius:26px;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .tile{
    display:grid;
    place-items:center;
    width:clamp(66px,19vw,92px);
    height:clamp(66px,19vw,92px);
    border-radius:20px;
    color:var(--tint);
    background:var(--tint-bg);
    box-shadow:inset 0 0 0 1px var(--tint-line);
    text-decoration:none;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .tile:hover{
    transform:translateY(-3px);
    background:var(--tint-bg-hi);
    box-shadow:inset 0 0 0 1px var(--tint-hi), 0 14px 32px -18px var(--tint-shadow);
  }
  .tile:active{transform:translateY(-1px) scale(.975)}
  .tile:focus-visible{outline:2px solid var(--tint);outline-offset:4px}
  .tile svg{width:40%;height:40%;display:block}
</style>
</head>
<body>
  <main class="dock">
    <a class="tile" href="https://my.henryma.top:1016/" aria-label="DSM" style="--tint:#4da3ff;--tint-bg:rgba(77,163,255,.12);--tint-bg-hi:rgba(77,163,255,.2);--tint-line:rgba(77,163,255,.24);--tint-hi:rgba(77,163,255,.62);--tint-shadow:rgba(77,163,255,.45)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/>
        <path d="M7 7.5h.01M7 16.5h.01"/><path d="M11 7.5h6M11 16.5h6"/>
      </svg>
    </a>

    <a class="tile" href="https://my.henryma.top:1016/photo/" aria-label="Photos" style="--tint:#57c785;--tint-bg:rgba(87,199,133,.12);--tint-bg-hi:rgba(87,199,133,.2);--tint-line:rgba(87,199,133,.24);--tint-hi:rgba(87,199,133,.62);--tint-shadow:rgba(87,199,133,.45)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.8" cy="10" r="1.6"/>
        <path d="M4 17.5l4.6-4.3a2 2 0 0 1 2.7 0l3 2.8"/><path d="M13.4 13.6l2.2-2a2 2 0 0 1 2.7 0L21 14.2"/>
      </svg>
    </a>

    <a class="tile" href="https://plex.henryma.top:1016/web/index.html" aria-label="Plex" style="--tint:#e5a00d;--tint-bg:rgba(229,160,13,.13);--tint-bg-hi:rgba(229,160,13,.21);--tint-line:rgba(229,160,13,.28);--tint-hi:rgba(229,160,13,.66);--tint-shadow:rgba(229,160,13,.45)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M8.4 18.5h7.2"/><path d="M12 17.5v1"/>
        <path d="M10.4 8.6l4.2 2.4-4.2 2.4z" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </main>
</body>
</html>
